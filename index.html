    <script>
    (function() {
        'use strict';

        // ========================================
        // КОНСТАНТЫ
        // ========================================
        const THEME_PRESETS = {
            
            basic:{'--bg':'#232220','--card':'#2e2c29','--text':'#e8e4dd','--text-secondary':'#c8bcaa','--accent':'#6b4c3b','--accent-light':'rgba(107, 76, 59, 0.3)','--danger':'#c9888e','--danger-light':'#3a2f30','--success':'#8aad95','--success-light':'#2d332f','--warning':'#c9b888','--warning-light':'#33302a','--border':'#4a3f35'},
            forest:{'--bg':'#252825','--card':'#30332e','--text':'#e0e4dd','--text-secondary':'#c8bcaa','--accent':'#7aaa7a','--accent-light':'rgba(122,170,122,0.2)','--danger':'#c97d7d','--danger-light':'#3a2f2f','--success':'#8aad8a','--success-light':'#2d332d','--warning':'#c9b87a','--warning-light':'#333028','--border':'#4a3f35'},
            sunset:{'--bg':'#2d2624','--card':'#38322e','--text':'#e8ddd9','--text-secondary':'#c8bcaa','--accent':'#c97d6b','--accent-light':'rgba(201,125,107,0.2)','--danger':'#c97d8b','--danger-light':'#3a2f32','--success':'#9bba8a','--success-light':'#2d332a','--warning':'#d4b88a','--warning-light':'#333028','--border':'#4a3f35'},
            ocean:{'--bg':'#242a2d','--card':'#2e3438','--text':'#dde4e8','--text-secondary':'#c8bcaa','--accent':'#6b8a9e','--accent-light':'rgba(107,138,158,0.2)','--danger':'#c97d7d','--danger-light':'#3a2f2f','--success':'#7aaa9a','--success-light':'#2d3330','--warning':'#c9b87a','--warning-light':'#333028','--border':'#4a3f35'}
        };
        const STORAGE_KEY = 'my_plans_v19';
        const TOAST_DURATION = 2500;
        const FILTERS = Object.freeze({ ACTIVE: 'active', COMPLETED: 'completed' });
        const SMART_FOLDERS = Object.freeze({ TODAY: 'smart-today', OVERDUE: 'smart-overdue', TRASH: 'smart-trash' });
        const ACTIONS_OBJ = Object.freeze({
            OPEN_FOLDER: 'open-folder', CHANGE_ICON: 'change-icon', TOGGLE_TASK: 'toggle-task',
            EDIT_TASK: 'edit-task', DELETE_TASK: 'delete-task', ADD_SUBTASK: 'add-subtask',
            EDIT_SUBTASK: 'edit-subtask', DELETE_SUBTASK: 'delete-subtask', TOGGLE_SUBTASK: 'toggle-subtask',
            EDIT_CLIENT: 'edit-client', EMAIL_CLIENT: 'email-client',
            DELETE_CLIENT: 'delete-client', SELECT_DATE: 'select-date', EDIT_CUSTOM_QUOTE: 'edit-custom-quote',
            DELETE_NOTE: 'delete-note', DELETE_FOLDER: 'delete-folder',
            DELETE_FOREVER: 'delete-forever', RESTORE_TASK: 'restore-task',
            DUPLICATE_TASK: 'duplicate-task', MOVE_TO_TOMORROW: 'move-to-tomorrow',
            ADD_SUBFOLDER: 'add-subfolder',
            DELETE_SUBFOLDER: 'delete-subfolder'
        });
        const A = ACTIONS_OBJ;
        const REPEAT_LABELS = Object.freeze({'':'Без повтора','daily':'Ежедневно','weekly':'Еженедельно','monthly':'Ежемесячно','yearly':'Ежегодно','custom':'Свой период'});
        const REPEAT_ABBREVIATIONS = Object.freeze({'daily':'день','weekly':'нед','monthly':'мес','yearly':'год'});
        const DEFAULT_FOLDER_ICON = '📁';
        const QUOTES = Object.freeze([
            'Через год, когда посмотришь в зеркало, ты будешь благодарен себе за то, что начал.',
            'Маленький шаг сегодня — большой результат завтра.',
            'Я есть богатство. Я есть изобилие. Я есть радость.',
            'Не жди идеального момента. Сделай момент идеальным.',
            'Максимальное уважение к игроку проявляется через жёсткие тренировки.',
            'То, что ты делаешь сегодня, определяет твоё завтра.'
        ]);
        const TASK_TYPES = Object.freeze({ TASK: 'task', BIRTHDAY: 'birthday' });
        const DAYS_OF_WEEK = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];

        // ========================================
        // УТИЛИТЫ
        // ========================================
        const Utils = Object.freeze({
            generateId() { return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6); },
            escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            },
            formatDate(d) {
                if (!d) return '';
                const p = d.split('-');
                return p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}` : d;
            },
            formatDateISO(d) {
                if (!(d instanceof Date) || isNaN(d.getTime())) return '';
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            },
            parseDate(d) {
                if (!d) return null;
                const parts = d.split('-');
                if (parts.length !== 3) return null;
                const dt = new Date(+parts[0], +parts[1] - 1, +parts[2]);
                dt.setHours(0, 0, 0, 0);
                return isNaN(dt.getTime()) ? null : dt;
            },
            getTodayISO() { return this.formatDateISO(new Date()); },
            getDaysUntil(d) {
                const t = new Date(); t.setHours(0, 0, 0, 0);
                const td = this.parseDate(d);
                return td ? Math.ceil((td - t) / 86400000) : null;
            },
            getDaysText(d) {
                const df = this.getDaysUntil(d);
                if (df === null) return null;
                if (df < 0) return { text: `⏳ ${Math.abs(df)} дн назад`, className: 'overdue' };
                if (df === 0) return { text: 'Сегодня', className: 'today' };
                if (df === 1) return { text: '⏳ Завтра', className: 'upcoming' };
                return { text: `⏳ через ${df} дн`, className: 'upcoming' };
            },
            getNextBirthday(d) {
                const p = d.split('-').map(Number);
                if (p.length !== 3) return null;
                const n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
                let b = new Date(n.getFullYear(), p[1] - 1, p[2]);
                if (b < t) b.setFullYear(n.getFullYear() + 1);
                return b;
            },
            getAge(b, d) {
                const p = b.split('-').map(Number);
                if (p.length !== 3) return 0;
                let a = d.getFullYear() - p[0];
                const bt = new Date(d.getFullYear(), p[1] - 1, p[2]);
                if (d < bt) a--;
                return Math.max(0, a);
            },
            getAgeWord(a) {
                if (typeof a !== 'number' || a < 0) return 'лет';
                const ld = a % 10, ltd = a % 100;
                if (ld === 1 && ltd !== 11) return 'год';
                if ([2, 3, 4].includes(ld) && ![12, 13, 14].includes(ltd)) return 'года';
                return 'лет';
            },
            getFolderStats(f) {
                if (!f) return { active: 0, completed: 0, total: 0 };
                
                function countTasks(folder) {
                    let active = 0, completed = 0;
                    if (Array.isArray(folder.tasks)) {
                        active += folder.tasks.filter(t => t && !t.completed).length;
                        completed += folder.tasks.filter(t => t && t.completed).length;
                    }
                    if (Array.isArray(folder.subfolders)) {
                        folder.subfolders.forEach(sub => {
                            const subStats = countTasks(sub);
                            active += subStats.active;
                            completed += subStats.completed;
                        });
                    }
                    return { active, completed };
                }
                
                const stats = countTasks(f);
                return { active: stats.active, completed: stats.completed, total: stats.active + stats.completed };
            },
            getAllTasksWithFolders() {
                const result = [];
                
                function collectFromFolder(folder) {
                    if (Array.isArray(folder.tasks)) {
                        folder.tasks.forEach(t => {
                            if (t) result.push({
                                ...t,
                                folderId: folder.id,
                                folderName: folder.name,
                                folderIcon: folder.icon || DEFAULT_FOLDER_ICON,
                                parentFolderId: folder._parentId || null
                            });
                        });
                    }
                    // Обходим подпапки
                    if (Array.isArray(folder.subfolders)) {
                        folder.subfolders.forEach(sub => collectFromFolder(sub));
                    }
                }
                
                State.getFolders().forEach(f => collectFromFolder(f));
                return result;
            },
            findTaskById(id) {
                function searchInFolder(folder) {
                    if (Array.isArray(folder.tasks)) {
                        const t = folder.tasks.find(t => t && t.id === id);
                        if (t) return { task: t, folder: folder };
                    }
                    if (Array.isArray(folder.subfolders)) {
                        for (const sub of folder.subfolders) {
                            const result = searchInFolder(sub);
                            if (result) return result;
                        }
                    }
                    return null;
                }
                
                for (const f of State.getFolders()) {
                    const result = searchInFolder(f);
                    if (result) return result;
                }
                return null;
            },
            isSmartFolder(id) { return id === SMART_FOLDERS.TODAY || id === SMART_FOLDERS.OVERDUE || id === SMART_FOLDERS.TRASH; },
            getValidTasksArray(t) { return Array.isArray(t) ? t.filter(t => t !== null && t !== undefined) : []; }
        });

        // ========================================
        // УПРАВЛЕНИЕ ДАННЫМИ (STATE)
        // ========================================
        const State = (() => {
            let data = {
                folders: [], notes: [], clients: [], currentFolderId: null,
                customQuotes: { left: '', center: '', right: '' },
                currentTaskFilter: FILTERS.ACTIVE, folderViewMode: 'list', todaySortMode: 'default'
            };

            function load() {
                try {
                    let saved = localStorage.getItem(STORAGE_KEY);
                    if (!saved) {
                        saved = localStorage.getItem('my_plans_v18');
                        if (saved) {
                            localStorage.setItem(STORAGE_KEY, saved);
                        }
                    }
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && typeof parsed === 'object') data = parsed;
                    }
                } catch (e) { /* данные повреждены, используем значения по умолчанию */ }

                data.folders = Array.isArray(data.folders) ? data.folders : [];
                // Миграция: добавляем subfolders старым папкам и подпапкам
                data.folders.forEach(f => {
                    if (!Array.isArray(f.subfolders)) f.subfolders = [];
                    // Рекурсивно проверяем подпапки
                    if (Array.isArray(f.subfolders)) {
                        f.subfolders.forEach(sub => {
                            if (!Array.isArray(sub.subfolders)) sub.subfolders = [];
                        });
                    }
                });
                data.notes = Array.isArray(data.notes) ? data.notes : [];
                data.clients = Array.isArray(data.clients) ? data.clients : [];
                data.customQuotes = data.customQuotes || { left: '', center: '', right: '' };
                data.currentTaskFilter = data.currentTaskFilter === FILTERS.COMPLETED ? FILTERS.COMPLETED : FILTERS.ACTIVE;
                data.folderViewMode = data.folderViewMode || 'list';

            function migrateFolder(folder) {
                if (!folder.icon) folder.icon = DEFAULT_FOLDER_ICON;
                if (folder.icon && folder.icon.length <= 4 && !folder.icon.startsWith('icon-')) {
                    folder.icon = 'folder';
                }
                folder.tasks = Utils.getValidTasksArray(folder.tasks);
                folder.tasks.forEach(t => {
                    if (!Array.isArray(t.subtasks)) t.subtasks = [];
                    if (t.priority === undefined || t.priority === null) t.priority = 0;
                });
                // Мигрируем подпапки
                if (Array.isArray(folder.subfolders)) {
                    folder.subfolders.forEach(sub => migrateFolder(sub));
                }
            }
            
            data.folders.forEach(f => migrateFolder(f));
            }
            function save() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); updateTitle(); } catch (e) {}
            }

            function updateTitle() {
                const active = data.folders
                    .filter(f => f.id !== SMART_FOLDERS.TRASH)
                    .reduce((s, f) => s + Utils.getFolderStats(f).active, 0);
                document.title = active > 0 ? `(${active}) Мои планы` : 'Мои планы';
            }

            return {
                load, save,
                getFolders: () => data.folders,
                getNotes: () => data.notes,
                getClients: () => data.clients,
                getCurrentFolderId: () => data.currentFolderId,
                getCustomQuotes: () => ({ ...data.customQuotes }),
                getCurrentTaskFilter: () => data.currentTaskFilter,
                getFolderViewMode: () => data.folderViewMode,
                setCurrentFolderId: (id) => { data.currentFolderId = id; },
                setCurrentTaskFilter: (f) => { if (f === FILTERS.ACTIVE || f === FILTERS.COMPLETED) data.currentTaskFilter = f; },
                setFolderViewMode: (m) => { data.folderViewMode = m; },
                getTodaySortMode: () => data.todaySortMode,
                setTodaySortMode: (m) => { if (['default', 'folder', 'time'].includes(m)) data.todaySortMode = m; },
                setCustomQuote: (s, t) => { if (['left', 'center', 'right'].includes(s)) data.customQuotes[s] = t; },
                getFolderById: (id) => data.folders.find(f => f.id === id),
                addFolder: (f) => { 
                    if (!Array.isArray(f.subfolders)) f.subfolders = [];
                    data.folders.push(f); 
                },
                removeFolder: (id) => {
                    // Проверяем, не является ли id подпапкой
                    for (const f of data.folders) {
                        if (Array.isArray(f.subfolders)) {
                            const idx = f.subfolders.findIndex(s => s.id === id);
                            if (idx !== -1) {
                                f.subfolders.splice(idx, 1);
                                return;
                            }
                        }
                    }
                    // Если не подпапка — удаляем корневую
                    data.folders = data.folders.filter(f => f.id !== id); 
                },
                getClientById: (id) => data.clients.find(c => c.id === id),
                addClient: (c) => { data.clients.push(c); },
                removeClient: (id) => { data.clients = data.clients.filter(c => c.id !== id); },
                addNote: (n) => { data.notes.unshift(n); },
                removeNote: (id) => { data.notes = data.notes.filter(n => n.id !== id); },
                getNoteById: (id) => data.notes.find(n => n.id === id),
                // Новые методы для подпапок
                findFolderById: (id) => {
                    // Ищет папку или подпапку по id во всей структуре
                    for (const f of data.folders) {
                        if (f.id === id) return f;
                        if (Array.isArray(f.subfolders)) {
                            const sub = f.subfolders.find(s => s.id === id);
                            if (sub) return sub;
                        }
                    }
                    return null;
                },
                getParentFolderId: (id) => {
                    // Находит id родительской папки для подпапки
                    for (const f of data.folders) {
                        if (Array.isArray(f.subfolders)) {
                            if (f.subfolders.some(s => s.id === id)) return f.id;
                        }
                    }
                    return null;
                },
                addSubFolder: (parentId, subFolder) => {
                    const parent = data.folders.find(f => f.id === parentId);
                    if (parent) {
                        if (!Array.isArray(parent.subfolders)) parent.subfolders = [];
                        parent.subfolders.push(subFolder);
                    }
                },
                removeSubFolder: (parentId, subFolderId) => {
                    const parent = data.folders.find(f => f.id === parentId);
                    if (parent && Array.isArray(parent.subfolders)) {
                        parent.subfolders = parent.subfolders.filter(s => s.id !== subFolderId);
                    }
                }
            };
        })();

        // ========================================
        // БИЗНЕС-ЛОГИКА (SERVICES)
        // ========================================
        const Services = (() => {
            function getTodayTasks() {
                const todayISO = Utils.getTodayISO();
                const result = [];

                function collectTasks(folder) {
                    Utils.getValidTasksArray(folder.tasks).forEach(t => {
                        if (!t.completed && t.date === todayISO)
                            result.push({ ...t, folderId: folder.id, folderName: folder.name, folderIcon: folder.icon, type: TASK_TYPES.TASK });
                    });
                    if (Array.isArray(folder.subfolders)) {
                        folder.subfolders.forEach(sub => collectTasks(sub));
                    }
                }
                State.getFolders().forEach(f => {
                    if (f.id === SMART_FOLDERS.TRASH) return;
                    collectTasks(f);
                });

                State.getClients().forEach(c => {
                    if (!c || !c.date) return;
                    const bd = Utils.getNextBirthday(c.date);
                    if (!bd) return;
                    if (Utils.formatDateISO(bd) === todayISO) {
                        const age = Utils.getAge(c.date, bd);
                        result.push({
                            id: 'bd_' + c.id, text: `${c.name} — ${age} ${Utils.getAgeWord(age)}`,
                            date: todayISO, time: '', completed: false, subtasks: [],
                            repeat: 'yearly', repeatDays: 0, priority: 3,
                            folderId: SMART_FOLDERS.TODAY, folderName: 'Дни рождения', folderIcon: '🎂', type: TASK_TYPES.BIRTHDAY
                        });
                    }
                });

                const sortMode = State.getTodaySortMode();
                if (sortMode === 'folder') {
                    result.sort((a, b) => (a.folderName || '').localeCompare(b.folderName || ''));
                } else if (sortMode === 'time') {
                    result.sort((a, b) => {
                        if (a.time && b.time) return a.time.localeCompare(b.time);
                        if (a.time) return -1;
                        if (b.time) return 1;
                        return (a.folderName || '').localeCompare(b.folderName || '');
                    });
                } else {
                    result.sort((a, b) => (b.priority || 0) - (a.priority || 0) || (a.time && b.time ? a.time.localeCompare(b.time) : a.time ? -1 : 1));
                }
                return result;
            }

            function getOverdueTasks() {
                const todayISO = Utils.getTodayISO();
                const result = [];
                function collectTasks(folder) {
                    Utils.getValidTasksArray(folder.tasks).forEach(t => {
                        if (!t.completed && t.date && t.date < todayISO)
                            result.push({ ...t, folderId: folder.id, folderName: folder.name, folderIcon: folder.icon, type: TASK_TYPES.TASK });
                    });
                    if (Array.isArray(folder.subfolders)) {
                        folder.subfolders.forEach(sub => collectTasks(sub));
                    }
                }
                State.getFolders().forEach(f => {
                    if (f.id === SMART_FOLDERS.TRASH) return;
                    collectTasks(f);
                });
                result.sort((a, b) => a.date.localeCompare(b.date));
                return result;
            }

            function getTasksForSmartFolder(id) {
                if (id === SMART_FOLDERS.TODAY) return getTodayTasks();
                if (id === SMART_FOLDERS.OVERDUE) return getOverdueTasks();
                return [];
            }

            function processRepeats() {
                const now = new Date(); now.setHours(0, 0, 0, 0);
                let hasChanges = false;

                function processFolder(f) {
                    if (f.id === SMART_FOLDERS.TRASH) return;
                    const snapshot = [...f.tasks];
                    snapshot.forEach(task => {
                        if (!task || !task.completed || !task.repeat || !task.date) return;
                        if (task.type === TASK_TYPES.BIRTHDAY) return;
                        try {
                            const d = Utils.parseDate(task.date);
                            if (!d) return;
                            const next = new Date(d);
                            switch (task.repeat) {
                                case 'daily': next.setDate(next.getDate() + 1); break;
                                case 'weekly': next.setDate(next.getDate() + 7); break;
                                case 'monthly': next.setMonth(next.getMonth() + 1); break;
                                case 'yearly': next.setFullYear(next.getFullYear() + 1); break;
                                case 'custom':
                                    if (task.repeatDays > 0) next.setDate(next.getDate() + task.repeatDays);
                                    else return;
                                    break;
                                default: return;
                            }
                            if (next <= d) return;
                            const nextISO = Utils.formatDateISO(next);
                            if (f.tasks.some(x => x && x.text === task.text && x.date === nextISO && !x.completed)) return;

                            const keepSubtasksDone = task.keepSubtasksDone === true;
                            f.tasks.push({
                                id: Utils.generateId(), text: task.text, date: nextISO, time: task.time,
                                completed: false,
                                subtasks: Utils.getValidTasksArray(task.subtasks).map(st => ({ 
                                    id: Utils.generateId(), 
                                    text: st.text, 
                                    completed: keepSubtasksDone ? st.completed : false
                                })),
                                repeat: task.repeat, 
                                repeatDays: task.repeatDays, 
                                priority: task.priority || 0,
                                keepSubtasksDone: keepSubtasksDone
                            });

                            const original = f.tasks.find(x => x.id === task.id);
                            if (original) { original.repeat = ''; original.repeatDays = 0; }
                            hasChanges = true;
                        } catch (e) {}
                    });

                    // Обходим подпапки
                    if (Array.isArray(f.subfolders)) {
                        f.subfolders.forEach(sub => processFolder(sub));
                    }
                }

                State.getFolders().forEach(f => processFolder(f));

                if (hasChanges) State.save();
            }

            function searchTasks(q) {
                if (!q) return [];
                const lq = q.toLowerCase().trim();
                return Utils.getAllTasksWithFolders().filter(t =>
                    t.text.toLowerCase().includes(lq) ||
                    (t.folderName && t.folderName.toLowerCase().includes(lq))
                );
            }

            function getCalendarData(y, m) {
                const firstDay = new Date(y, m, 1);
                let startOffset = firstDay.getDay() || 7;
                startOffset -= 1;
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                const todayISO = Utils.getTodayISO();
                const days = [];

                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = Utils.formatDateISO(new Date(y, m, d));
                    days.push({ day: d, dateStr, isToday: dateStr === todayISO, hasTasks: checkDateHasTasks(dateStr) });
                }
                return { startOffset, days, daysInMonth };
            }

            function checkDateHasTasks(dateStr) {
                function folderHasTask(folder) {
                    if (Utils.getValidTasksArray(folder.tasks).some(t => t && t.date === dateStr && !t.completed)) return true;
                    if (Array.isArray(folder.subfolders)) {
                        return folder.subfolders.some(sub => folderHasTask(sub));
                    }
                    return false;
                }
                const hasFolderTasks = State.getFolders().some(f =>
                    f.id !== SMART_FOLDERS.TRASH && folderHasTask(f)
                );
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const hasBirthday = State.getClients().some(c => {
                    if (!c || !c.date) return false;
                    const bd = Utils.getNextBirthday(c.date);
                    return bd && Utils.formatDateISO(bd) === dateStr;
                });
                return hasFolderTasks || hasBirthday;
            }

            function getTasksForDate(dateStr) {
                const result = [];
                const keys = new Set();

                function collectFromFolder(folder) {
                    Utils.getValidTasksArray(folder.tasks).forEach(t => {
                        if (!t || t.date !== dateStr || t.completed) return;
                        const k = `task_${t.id}`;
                        if (!keys.has(k)) {
                            keys.add(k);
                            result.push({ text: t.text, type: TASK_TYPES.TASK, folder: folder.name, icon: folder.icon, time: t.time || '' });
                        }
                    });
                    if (Array.isArray(folder.subfolders)) {
                        folder.subfolders.forEach(sub => collectFromFolder(sub));
                    }
                }

                State.getFolders().forEach(f => {
                    if (f.id === SMART_FOLDERS.TRASH) return;
                    collectFromFolder(f);
                });

                State.getClients().forEach(c => {
                    if (!c || !c.date) return;
                    const bd = Utils.getNextBirthday(c.date);
                    if (!bd) return;
                    if (Utils.formatDateISO(bd) !== dateStr) return;
                    const k = `bd_${c.name.toLowerCase()}_${c.date}`;
                    if (!keys.has(k)) {
                        keys.add(k);
                        const age = Utils.getAge(c.date, bd);
                        result.push({ text: `${c.name} — ${age} ${Utils.getAgeWord(age)}`, type: TASK_TYPES.BIRTHDAY });
                    }
                });

                return result;
            }

            function getStats() {
                const allTasks = Utils.getAllTasksWithFolders().filter(t => t.folderId !== SMART_FOLDERS.TRASH);
                const total = allTasks.length;
                const completed = allTasks.filter(t => t.completed).length;
                const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

                const folderStats = State.getFolders()
                    .filter(f => f.id !== SMART_FOLDERS.TRASH)
                    .map(f => {
                        const s = Utils.getFolderStats(f);
                        return { icon: f.icon || DEFAULT_FOLDER_ICON, name: f.name, completed: s.completed, total: s.total };
                    });

                return { total, completed, percent, folderStats };
            }

            function getUpcomingBirthdays(days = 7) {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                return State.getClients()
                    .filter(c => {
                        if (!c || !c.date) return false;
                        const b = Utils.getNextBirthday(c.date);
                        if (!b) return false;
                        const df = Math.ceil((b - today) / 86400000);
                        return df >= 0 && df <= days;
                    })
                    .map(c => {
                        const b = Utils.getNextBirthday(c.date);
                        const age = Utils.getAge(c.date, b);
                        return { name: c.name, daysUntil: Math.ceil((b - today) / 86400000), age };
                    });
            }

            function getClientsSorted() {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                return [...State.getClients()]
                    .sort((a, b) => {
                        const ba = Utils.getNextBirthday(a.date), bb = Utils.getNextBirthday(b.date);
                        if (!ba || !bb) return 0;
                        return ba - bb;
                    })
                    .map(c => {
                        const b = Utils.getNextBirthday(c.date);
                        if (!b) return null;
                        return { ...c, birthday: b, age: Utils.getAge(c.date, b), daysUntil: Math.ceil((b - today) / 86400000) };
                    })
                    .filter(c => c !== null);
            }
            
            function getTasksForNotification() {
                const now = new Date();
                const oneHourLater = new Date(now.getTime() + 3600000);
                const result = [];
                const todayISO = Utils.formatDateISO(new Date());
                
                State.getFolders().forEach(f => {
                    if (f.id === SMART_FOLDERS.TRASH) return;
                    Utils.getValidTasksArray(f.tasks).forEach(t => {
                        if (!t || t.completed || !t.date) return;
                        
                        if (t.time) {
                            const dt = new Date(t.date + 'T' + t.time);
                            if (!isNaN(dt.getTime()) && dt > now && dt <= oneHourLater) {
                                result.push({ ...t, folderName: f.name });
                            }
                        } 
                        else if (t.date === todayISO) {
                            const nineAM = new Date();
                            nineAM.setHours(9, 0, 0, 0);
                            const nineTen = new Date();
                            nineTen.setHours(9, 10, 0, 0);
                            if (now >= nineAM && now <= nineTen) {
                                result.push({ ...t, folderName: f.name });
                            }
                        }
                    });
                });
                
                return result;
            }

            function getWeekData() {
                const today = new Date();
                const dow = today.getDay();
                const monday = new Date(today);
                monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1));
                const days = [];

                for (let i = 0; i < 7; i++) {
                    const d = new Date(monday); d.setDate(monday.getDate() + i);
                    const dateStr = Utils.formatDateISO(d);

                    function countTasksInFolder(folder) {
                        let count = Utils.getValidTasksArray(folder.tasks).filter(t => t && !t.completed && t.date === dateStr).length;
                        if (Array.isArray(folder.subfolders)) {
                            folder.subfolders.forEach(sub => count += countTasksInFolder(sub));
                        }
                        return count;
                    }
                    const folderCount = State.getFolders()
                        .filter(f => f.id !== SMART_FOLDERS.TRASH)
                        .reduce((s, f) => s + countTasksInFolder(f), 0);

                    const birthdayCount = State.getClients().filter(c => {
                        if (!c || !c.date) return false;
                        const bd = Utils.getNextBirthday(c.date);
                        return bd && Utils.formatDateISO(bd) === dateStr;
                    }).length;

                    days.push({
                        date: d, dateStr, dayName: DAYS_OF_WEEK[d.getDay()],
                        dayOfMonth: d.getDate(), count: folderCount + birthdayCount,
                        isToday: dateStr === Utils.getTodayISO()
                    });
                }

                return days;
            }

            return {
                getTodayTasks, getOverdueTasks, getTasksForSmartFolder, processRepeats,
                searchTasks, getCalendarData, getTasksForDate, getStats,
                getUpcomingBirthdays, getClientsSorted, getTasksForNotification, getWeekData
            };
        })();

        // ========================================
        // UI (ОТРИСОВКА)
        // ========================================
        const UI = (() => {

            function showToast(msg) {
                const t = getEl('toast');
                if (!t) return;
                t.textContent = msg;
                t.classList.add('show');
                clearTimeout(t._timeout);
                t._timeout = setTimeout(() => t.classList.remove('show'), TOAST_DURATION);
            }

            function updateQuote() {
                const el = getEl('bgQuote');
                if (!el) return;
                el.textContent = '«' + QUOTES[Math.floor(Math.random() * QUOTES.length)] + '»';
                el.style.opacity = '1';
            }

            function renderCustomQuotes() {
                const q = State.getCustomQuotes();
                ['left', 'center', 'right'].forEach(s => {
                    const el = getEl('customQuote' + s.charAt(0).toUpperCase() + s.slice(1));
                    if (el) el.textContent = q[s] || '💬 Своя цитата ' + (s === 'left' ? 'слева' : s === 'center' ? 'центр' : 'справа');
                });
            }

            function renderWeekOverview() {
                const c = getEl('weekOverview');
                if (!c || c.style.display === 'none') return;
                const days = Services.getWeekData();
                let h = '';
                for (let i = 0; i < days.length; i++) {
                    const d = days[i];
                    h += '<div class="week-day' + (d.isToday ? ' today' : '') + '" data-date="' + d.dateStr +
                        '" onclick="App.openDateView(\'' + d.dateStr + '\')">' +
                        '<div class="week-day-name">' + d.dayName + '</div>' +
                        '<div class="week-day-date">' + d.dayOfMonth + '</div>' +
                        '<div class="week-day-count">' + (d.count ? d.count : '—') + '</div></div>';
                }
                c.innerHTML = h;
            }

            function renderFolderList(searchResults = null) {
                const c = getEl('folderList');
                if (!c) return;
                if (searchResults !== null) { renderSearchResults(c, searchResults); return; }

                const vm = State.getFolderViewMode();
                let h = '';
                const todayTasks = Services.getTodayTasks();
                h += buildSmartFolderHTML(SMART_FOLDERS.TODAY, '📅', 'Сегодня', todayTasks.length);

                const overdueTasks = Services.getOverdueTasks();
                if (overdueTasks.length > 0) {
                    h += buildSmartFolderHTML(SMART_FOLDERS.OVERDUE, '⚠️', 'Просроченные', overdueTasks.length, 'var(--overdue)');
                }

                const trashFolder = State.getFolders().find(f => f.id === SMART_FOLDERS.TRASH);
                if (trashFolder && trashFolder.tasks.length > 0) {
                    h += buildSmartFolderHTML(SMART_FOLDERS.TRASH, '🗑️', 'Корзина', trashFolder.tasks.length);
                }

                const folders = State.getFolders().filter(f => f.id !== SMART_FOLDERS.TRASH);
                if (!folders.length && !todayTasks.length) {
                    h += '<p style="text-align:center;padding:20px;opacity:0.6;">Нет папок. Создайте первую!</p>';
                } else if (folders.length) {
                    h += '<div class="' + (vm === 'grid' ? 'folder-grid' : '') + '">' +
                        folders.map(buildFolderCardHTML).join('') + '</div>';
                }

                c.innerHTML = h;
                c.querySelectorAll('.view-toggle-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        State.setFolderViewMode(this.dataset.view);
                        State.save();
                        renderFolderList();
                    });
                });
            }

            function buildSmartFolderHTML(id, icon, name, count, color) {
                const style = color ? ' style="color:' + color + ';"' : '';
                return '<div class="folder-card ' + (id === SMART_FOLDERS.TODAY ? 'smart-today' : 'smart-overdue') +
                    '" data-action="' + A.OPEN_FOLDER + '" data-folder-id="' + id + '">' +
                    '<span class="folder-icon">' + icon + '</span>' +
                    '<div class="folder-info"><div class="folder-name">' + name + '</div>' +
                    '<div class="folder-stats"><span class="stat-active"' + style + '>' + count + ' задач</span></div></div></div>';
            }
            function buildFolderCardHTML(f) {
                const stats = Utils.getFolderStats(f);
                let bgStyle = '';
                if (f.customImage) bgStyle = 'background-image:url(' + f.customImage + ');background-size:cover;background-position:center;';
                else if (f.color) bgStyle = 'background:' + f.color + ';';
                else if (f.opacity) bgStyle = '';
                else bgStyle = '';

                const iconHTML = '<svg style="width:28px;height:28px;fill:var(--text);"><use href="#icon-' + ((f.icon && f.icon.startsWith('icon-')) ? f.icon.replace('icon-','') : 'folder') + '"></use></svg>';
                return '<div class="folder-card" style="' + bgStyle + '" data-action="' + A.OPEN_FOLDER +
                    '" data-folder-id="' + f.id + '" data-folder-name="' + Utils.escapeHtml(f.name).replace(/'/g, "\\'") + '"' +
                    ' data-folder-stats="' + stats.active + '/' + stats.completed + '"' +
                    ' ondragover="App.handleDragOver(event)" ondragleave="App.handleDragLeave(event)"' +
                    ' ondrop="App.handleDrop(event, \'' + f.id + '\')"' +
                    'oncontextmenu="App.showFolderPanel(event, \'' + f.id + '\', \'' + Utils.escapeHtml(f.name).replace(/'/g, "\\'") + '\', \'' + stats.active + '\', \'' + stats.completed + '\'); return false;"' +
                    'ontouchstart="App.folderTouchStart(event, \'' + f.id + '\', \'' + Utils.escapeHtml(f.name).replace(/'/g, "\\'") + '\', \'' + stats.active + '\', \'' + stats.completed + '\')"' +
                    'ontouchend="App.folderTouchEnd(event)"' +
                    '>' +
                    '<div class="folder-icon-circle">' + iconHTML + '</div>' +
                    '<div class="folder-info"><div class="folder-name">' + Utils.escapeHtml(f.name) + '</div></div>' +
                    '</div>';
            }

            function renderSearchResults(container, tasks) {
                if (!tasks.length) {
                    container.innerHTML = '<p style="text-align:center;padding:20px;opacity:0.6;">🔍 Ничего не найдено</p>';
                    return;
                }
                container.innerHTML = '<div style="margin-bottom:10px;"><button class="btn-sm" id="btnClearSearch">← Назад к папкам</button></div>' +
                    tasks.map(t => buildTaskHTML(t, t.folderId, true)).join('');
                getEl('btnClearSearch')?.addEventListener('click', () => {
                    getEl('searchInput').value = '';
                    getEl('searchStats').style.display = 'none';
                    renderFolderList();
                });
            }

            function renderTasks() {
                const tc = getEl('taskContainer'), fl = getEl('folderList');
                const folderActions = getEl('folderActions');
                if (!tc || !fl) return;
                const cid = State.getCurrentFolderId();
                if (!cid) { 
                    tc.style.display = 'none'; 
                    fl.style.display = 'block'; 
                    if (folderActions) folderActions.style.display = 'flex';
                    return; 
                }
                if (folderActions) folderActions.style.display = 'none';
                if (Utils.isSmartFolder(cid)) renderSmartFolderTasks(tc, fl, cid);
                else renderRegularFolderTasks(tc, fl, cid);
            }

            function renderSmartFolderTasks(tc, fl, fid) {
                tc.style.display = 'flex'; fl.style.display = 'none';
                const fe = getEl('currentFolderName');
                if (fe) {
                    if (fid === SMART_FOLDERS.TODAY) fe.textContent = 'Сегодня';
                    else if (fid === SMART_FOLDERS.OVERDUE) fe.textContent = '⚠️ Просроченные';
                    else fe.textContent = '🗑️ Корзина';
                }
                const taskFilter = getEl('taskFilter');
                if (taskFilter) taskFilter.style.display = 'none';
                const btnTodaySort = getEl('btnTodaySort');
                if (btnTodaySort) btnTodaySort.style.display = (fid === SMART_FOLDERS.TODAY || fid === SMART_FOLDERS.OVERDUE) ? '' : 'none';
                const inputRow = document.querySelector('.input-row');
                if (inputRow) inputRow.style.display = 'none';

                const tasks = fid === SMART_FOLDERS.TRASH
                    ? (State.findFolderById(fid)?.tasks || [])
                    : Services.getTasksForSmartFolder(fid);

                const tl = getEl('taskList');
                if (!tl) return;
                if (tasks.length) {
                    tl.innerHTML = tasks.map(t => {
                        if (t.type && t.type === TASK_TYPES.BIRTHDAY) {
                            return '<div class="task-item" style="opacity:0.9"><div style="flex:1"><span class="task-text">🎂 ' +
                                Utils.escapeHtml(t.text) + '</span><br><small style="color:var(--accent)">Сегодня праздник!</small></div>' +
                                '<span class="days-badge today">Сегодня</span></div>';
                        }
                        return buildTaskHTML(t, t.folderId || fid, true);
                    }).join('');
                } else {
                    tl.innerHTML = '<div class="no-tasks">Задач нет!</div>';
                }
            }

            function renderRegularFolderTasks(tc, fl, fid) {
                const btnTodaySort = getEl('btnTodaySort');
                if (btnTodaySort) btnTodaySort.style.display = 'none';
                const taskFilter = getEl('taskFilter');
                if (taskFilter) taskFilter.style.display = 'none';
                const inputRow = document.querySelector('.input-row');
                if (inputRow) inputRow.style.display = 'none';

                const f = State.findFolderById(fid);
                if (!f) { tc.style.display = 'none'; fl.style.display = 'block'; return; }

                tc.style.display = 'flex'; fl.style.display = 'none';
                // Статистика папки
                const stats = Utils.getFolderStats(f);
                
                // Формируем название папки
                let folderDisplayName = (f.icon || DEFAULT_FOLDER_ICON) + ' ' + f.name;
                const parentId = State.getParentFolderId(fid);
                if (parentId) {
                    const parent = State.getFolderById(parentId);
                    if (parent) {
                        folderDisplayName = (parent.icon || DEFAULT_FOLDER_ICON) + ' ' + parent.name + ' → ' + (f.icon || '📁') + ' ' + f.name;
                    }
                }
                
                // Верхняя строка: все элементы с равными отступами
                const currentFilter = State.getCurrentTaskFilter();
                const isActive = currentFilter === FILTERS.ACTIVE;
                getEl('currentFolderName').innerHTML = 
                    '<div style="display:flex;align-items:center;justify-content:space-between;width:100%;">' +
                    '<button class="btn-sm btn-add" id="btnAddTaskTop" style="padding:8px 14px;border-radius:22px;font-size:13px;white-space:nowrap;flex-shrink:0;">+ Задача</button>' +
                    '<span style="font-weight:700;font-size:18px;text-align:center;">' + folderDisplayName + '</span>' +
                    '<button id="statFilterBtn" style="display:flex;align-items:center;gap:0;cursor:pointer;background:transparent;border:1.5px solid var(--border);border-radius:22px;padding:0;overflow:hidden;flex-shrink:0;">' +
                    '<span id="statActivePart" style="padding:8px 12px;font-size:13px;font-weight:600;color:' + (isActive ? 'var(--accent)' : 'var(--text-secondary)') + ';background:transparent;border-radius:22px 0 0 22px;">' + stats.active + '</span>' +
                    '<span style="color:var(--border);font-weight:300;padding:8px 0;font-size:13px;">/</span>' +
                    '<span id="statCompletedPart" style="padding:8px 12px;font-size:13px;font-weight:600;color:' + (!isActive ? 'var(--accent)' : 'var(--text-secondary)') + ';background:transparent;border-radius:0 22px 22px 0;">' + stats.completed + '</span>' +
                    '</button>' +
                    '</div>';
                
                // Вешаем обработчики
                setTimeout(() => {
                    const addBtn = document.getElementById('btnAddTaskTop');
                    if (addBtn) addBtn.addEventListener('click', function() { Actions.addTaskPopup(); });
                    
                    const activePart = document.getElementById('statActivePart');
                    if (activePart) activePart.addEventListener('click', function(e) {
                        e.stopPropagation();
                        State.setCurrentTaskFilter(FILTERS.ACTIVE); State.save(); UI.renderTasks();
                    });
                    
                    const completedPart = document.getElementById('statCompletedPart');
                    if (completedPart) completedPart.addEventListener('click', function(e) {
                        e.stopPropagation();
                        State.setCurrentTaskFilter(FILTERS.COMPLETED); State.save(); UI.renderTasks();
                    });
                }, 50);

                const tl = getEl('taskList');
                if (!tl) return;
                let subfoldersHTML = '';
                // --- НОВЫЙ БЛОК: подпапки в ряд ---
                if (Array.isArray(f.subfolders) && f.subfolders.length > 0) {
                    subfoldersHTML += '<div style="margin-bottom:12px;">';
                    subfoldersHTML += '<div style="display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;">';
                    
                    const subViewMode = f._subViewMode || 'list';
                    
                    if (subViewMode === 'grid') {
                        subfoldersHTML += '<div style="display:flex;justify-content:center;flex-wrap:wrap;gap:14px;width:100%;">';
                        f.subfolders.forEach(sub => {
                            const stats = Utils.getFolderStats(sub);
                            subfoldersHTML += '<div class="folder-card" data-action="' + A.OPEN_FOLDER + '" data-folder-id="' + sub.id + '" style="width:100px;height:100px;flex-direction:column;justify-content:center;align-items:center;gap:6px;' + (sub.color ? 'background:' + sub.color + ';' : 'background:rgba(46,44,41,var(--opacity-card));') + 'border-radius:50%;text-align:center;flex-shrink:0;" ondragover="App.handleDragOver(event)" ondragleave="App.handleDragLeave(event)" ondrop="App.handleDrop(event, \'' + sub.id + '\')" oncontextmenu="event.stopPropagation();event.preventDefault();App.showSubFolderPanel(event,\'' + sub.id + '\',\'' + Utils.escapeHtml(sub.name).replace(/'/g, "\\'") + '\',\'' + stats.active + '\',\'' + stats.completed + '\');return false;" ontouchstart="event.stopPropagation();App.subFolderTouchStart(event,\'' + sub.id + '\',\'' + Utils.escapeHtml(sub.name).replace(/'/g, "\\'") + '\',\'' + stats.active + '\',\'' + stats.completed + '\')" ontouchend="App.subFolderTouchEnd(event)">';
                            subfoldersHTML += '<svg style="width:28px;height:28px;fill:var(--text);"><use href="#icon-' + ((sub.icon && sub.icon.startsWith('icon-')) ? sub.icon.replace('icon-','') : 'folder') + '"></use></svg>';
                            subfoldersHTML += '<div style="font-size:13px;font-weight:600;max-width:80px;word-wrap:break-word;text-align:center;line-height:1.2;">' + Utils.escapeHtml(sub.name) + '</div>';
                            subfoldersHTML += '</div>';
                        });
                        subfoldersHTML += '</div>';
                    } else {
                        f.subfolders.forEach(sub => {
                            const stats = Utils.getFolderStats(sub);
                            subfoldersHTML += '<div class="folder-card" data-action="' + A.OPEN_FOLDER + '" data-folder-id="' + sub.id + '" style="display:flex;align-items:center;gap:10px;padding:8px 12px;' + (sub.color ? 'background:' + sub.color + ';' : 'background:rgba(46,44,41,var(--opacity-card));') + 'border-radius:20px;flex-shrink:0;" ondragover="App.handleDragOver(event)" ondragleave="App.handleDragLeave(event)" ondrop="App.handleDrop(event, \'' + sub.id + '\')" oncontextmenu="event.stopPropagation();event.preventDefault();App.showSubFolderPanel(event,\'' + sub.id + '\',\'' + Utils.escapeHtml(sub.name).replace(/'/g, "\\'") + '\',\'' + stats.active + '\',\'' + stats.completed + '\');return false;" ontouchstart="event.stopPropagation();App.subFolderTouchStart(event,\'' + sub.id + '\',\'' + Utils.escapeHtml(sub.name).replace(/'/g, "\\'") + '\',\'' + stats.active + '\',\'' + stats.completed + '\')" ontouchend="App.subFolderTouchEnd(event)">';
                            subfoldersHTML += '<svg style="width:22px;height:22px;fill:var(--text);"><use href="#icon-' + ((sub.icon && sub.icon.startsWith('icon-')) ? sub.icon.replace('icon-','') : 'folder') + '"></use></svg>';
                            subfoldersHTML += '<span style="font-size:15px;font-weight:600;">' + Utils.escapeHtml(sub.name) + '</span>';
                            subfoldersHTML += '</div>';
                        });
                    }
                    
                    // Кнопка + и переключатель в том же ряду
                    if (!parentId) {
                        subfoldersHTML += '<button class="btn-sm btn-add" id="btnAddSubFolder" data-action="' + A.ADD_SUBFOLDER + '" data-folder-id="' + f.id + '" style="width:36px;height:36px;border-radius:50%;font-size:18px;padding:0;flex-shrink:0;opacity:0.4;transition:opacity 0.2s;" onmouseenter="this.style.opacity=\'1\'" onmouseleave="this.style.opacity=\'0.4\'">+</button>';
                    }
                    subfoldersHTML += '<button class="btn-sm" id="btnToggleSubView" style="background:rgba(107,76,59,0.15);color:var(--accent);font-size:16px;border-radius:50%;width:36px;height:36px;min-width:36px;padding:0;flex-shrink:0;margin-left:auto;">⋮</button>';
                    
                    subfoldersHTML += '</div></div>';
                } else {
                    // Нет подпапок — кнопка только для главной папки
                    if (!parentId) {
                        subfoldersHTML += '<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;">';
                        subfoldersHTML += '<button class="btn-sm btn-add" data-action="' + A.ADD_SUBFOLDER + '" data-folder-id="' + f.id + '" style="border-radius:50%;width:36px;height:36px;font-size:18px;padding:0;opacity:0.4;transition:opacity 0.2s;" onmouseenter="this.style.opacity=\'1\'" onmouseleave="this.style.opacity=\'0.4\'">+</button>';
                        subfoldersHTML += '<span style="font-size:12px;color:var(--text-secondary);">Новая подпапка</span>';
                        subfoldersHTML += '</div>';
                    }
                }
                // --- КОНЕЦ БЛОКА ПОДПАПОК ---

                const tasks = Utils.getValidTasksArray(f.tasks);
                if (!tasks.length) {
                    tl.innerHTML = subfoldersHTML + '<div class="no-tasks">Нет задач в этой папке</div>';
                    return;
                }

                const filter = State.getCurrentTaskFilter();
                const filtered = filter === FILTERS.ACTIVE
                    ? tasks.filter(t => !t.completed)
                    : tasks.filter(t => t.completed);

                filtered.sort((a, b) => (b.priority || 0) - (a.priority || 0) ||
                    (!a.date && !b.date ? 0 : !a.date ? 1 : !b.date ? -1 : a.date.localeCompare(b.date)));

                tl.innerHTML = subfoldersHTML + (filtered.length
                    ? filtered.map(t => buildTaskHTML(t, fid, false)).join('')
                    : '<div class="no-tasks">' + (filter === FILTERS.ACTIVE ? 'Все задачи выполнены!' : 'Нет завершенных задач') + '</div>');
            }

            function updateTaskFilterUI(stats) {
                getEl('activeCount').textContent = stats.active;
                getEl('completedCount').textContent = stats.completed;
                const filter = State.getCurrentTaskFilter();
                document.querySelectorAll('.task-filter-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });
            }

            function buildTaskHTML(task, fid, showFolderName) {
                const isTrash = fid === SMART_FOLDERS.TRASH || task.folderId === SMART_FOLDERS.TRASH;
                const escapedText = Utils.escapeHtml(task.text).replace(/'/g, "\\'");
                let h = '<div class="task-item ' + (task.completed ? 'completed' : '') +
                    '" data-task-id="' + task.id + '" data-folder-id="' + fid +
                    '" onclick="App.showActionPanel(event,\'' + task.id + '\',\'' + fid + '\',\'' + escapedText + '\',' + isTrash + ')"' + '>' +
                    '<div class="task-checkbox" data-action="' + A.TOGGLE_TASK + '" data-task-id="' + task.id + '">' +
                    (task.completed ? '✓' : '') + '</div>' +
                    '<div style="flex:1;min-width:100px;"><span class="task-text">' + Utils.escapeHtml(task.text) + '</span>';

                if (showFolderName && task.folderName) {
                    h += '<div style="font-size:10px;color:var(--text-secondary);">📁 ' + Utils.escapeHtml(task.folderName) + '</div>';
                }

                h += '</div>';
                h += buildTaskBadgesHTML(task);
                h += buildSubtasksHTML(task);
                h += '</div>';
                return h;
            }

            function buildSubtasksHTML(task) {
                if (!Array.isArray(task.subtasks) || !task.subtasks.length) return '';
                let h = '<ul class="subtask-list">';
                task.subtasks.forEach(st => {
                    if (!st) return;
                    const isSubtaskOverdue = !st.completed && st.time && task.date && task.date === Utils.getTodayISO() && st.time < new Date().toTimeString().slice(0, 5);
                    h += '<li class="subtask-item ' + (st.completed ? 'completed' : '') + (isSubtaskOverdue ? ' overdue' : '') + '" ondblclick="event.stopPropagation();App.showSubtaskPanel(event,\'' + task.id + '\',\'' + st.id + '\')" oncontextmenu="event.stopPropagation();event.preventDefault();App.showSubtaskPanel(event,\'' + task.id + '\',\'' + st.id + '\');return false;">' +
                        '<div class="subtask-checkbox" data-action="' + A.TOGGLE_SUBTASK +
                        '" data-task-id="' + task.id + '" data-subtask-id="' + st.id + '">' + (st.completed ? '✓' : '') + '</div>' +
                        '<span class="subtask-text">' + Utils.escapeHtml(st.text) + (st.time ? ' <span style="font-size:11px;opacity:0.7;">🕐 ' + st.time + '</span>' : '') + '</span>' +
                    '</li>';
                });
        
                return h + '</ul>';
            }

            function buildTaskBadgesHTML(task) {
                let h = '';
                if (task.repeat) {
                    const label = task.repeat === 'custom' ? (task.repeatDays || '?') + 'д' : (REPEAT_ABBREVIATIONS[task.repeat] || task.repeat);
                    h += '<span class="repeat-badge">🔁 ' + label + '</span>';
                }
                if (task.time) h += '<span>🕐 ' + task.time + '</span>';
                if (task.date) {
                    let dtc = task.date;
                    if (task.type === TASK_TYPES.BIRTHDAY) {
                        const nb = Utils.getNextBirthday(task.date);
                        if (nb) dtc = Utils.formatDateISO(nb);
                    }
                    const di = Utils.getDaysText(dtc);
                    h += di
                        ? '<span class="days-badge ' + di.className + '">' + di.text + '</span>'
                        : '<span>' + Utils.formatDate(task.date) + '</span>';
                }
                return h;
            }

            function renderNotes() {
                const c = getEl('notesList');
                if (!c) return;
                const notes = State.getNotes();
                c.innerHTML = notes.length
                    ? notes.filter(n => n).map(n =>
                        '<div class="note-card"><div style="display:flex;justify-content:flex-end;margin-bottom:8px;">' +
                        '<button class="btn-sm btn-danger" data-action="' + A.DELETE_NOTE + '" data-note-id="' + n.id + '">✕</button></div>' +
                        '<textarea class="note-textarea" data-note-id="' + n.id + '">' + Utils.escapeHtml(n.text || '') + '</textarea></div>'
                    ).join('')
                    : '<p style="text-align:center;padding:20px;">Нет заметок</p>';
            }

            function renderCalendar(year, month, selectedDate) {
                getEl('calendarTitle').textContent = new Date(year, month).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
                const grid = getEl('calendarGrid');
                if (!grid) return;

                const data = Services.getCalendarData(year, month);
                grid.innerHTML = '';

                ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(day => {
                    const wd = document.createElement('div');
                    wd.style.cssText = 'font-size:10px;font-weight:700;';
                    wd.textContent = day;
                    grid.appendChild(wd);
                });

                for (let i = 0; i < data.startOffset; i++) {
                    grid.appendChild(document.createElement('div'));
                }

                data.days.forEach(dayData => {
                    const div = document.createElement('div');
                    div.className = 'calendar-day';
                    if (dayData.isToday) div.classList.add('today');
                    if (dayData.hasTasks) div.classList.add('has-tasks');
                    if (dayData.dateStr === selectedDate) div.classList.add('selected');
                    div.textContent = dayData.day;
                    div.style.cursor = 'pointer';
                    div.onclick = function() {
                        document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected'));
                        this.classList.add('selected');
                        AppState.selectedDate = dayData.dateStr;
                        renderCalendarTasks(dayData.dateStr);
                    };
                    grid.appendChild(div);
                });

                renderCalendarTasks(selectedDate);
            }

            function renderCalendarTasks(selectedDate) {
                const c = getEl('calendarTasks');
                if (!c) return;
                if (!selectedDate) { c.innerHTML = ''; return; }

                const tasks = Services.getTasksForDate(selectedDate);
                if (!tasks || !tasks.length) {
                    c.innerHTML = '<p style="text-align:center;padding:10px;">Нет задач на эту дату</p>';
                    return;
                }

                let html = '<strong>' + Utils.formatDate(selectedDate) + '</strong><br>';
                tasks.forEach(t => {
                    if (t.type === TASK_TYPES.BIRTHDAY) {
                        html += '<div class="task-item">🎂 ' + Utils.escapeHtml(t.text) + '</div>';
                    } else {
                        const timeStr = t.time ? '  ' + t.time : '';
                        const folderStr = t.folder ? '<br><small style="color:var(--text-secondary)">📁 ' + Utils.escapeHtml(t.folder) + '</small>' : '';
                        html += '<div class="task-item" style="cursor:pointer" onclick="window.App.goToFolder(\'' +
                            Utils.escapeHtml(t.folder || '') + '\')"><span>' + Utils.escapeHtml(t.text) + '</span>' + timeStr + folderStr + '</div>';
                    }
                });
                c.innerHTML = html;
            }

            function renderAI() {
                const c = getEl('aiContent');
                if (!c) return;
                const upcoming = Services.getUpcomingBirthdays();
                c.innerHTML = upcoming.length
                    ? '<strong>Ближайшие ДР:</strong><br>' + upcoming.map(x => '• ' + Utils.escapeHtml(x.name) + ' — через ' + x.daysUntil + ' дн.').join('<br>')
                    : '<p>Всё под контролем!</p>';
            }

            function renderClients() {
                const c = getEl('clientList');
                if (!c) return;
                const clients = State.getClients();
                if (!clients.length) { c.innerHTML = '<p>Нет клиентов</p>'; return; }

                const sorted = Services.getClientsSorted();
                c.innerHTML = sorted.map(x => {
                    const ds = x.birthday.getDate() + ' ' + x.birthday.toLocaleDateString('ru-RU', { month: 'long' }) + ' ' + x.birthday.getFullYear();
                    const st = x.daysUntil === 0 ? 'Сегодня!' : x.daysUntil === 1 ? 'Завтра!' : ds + ' (через ' + x.daysUntil + ' дн.)';
                    return '<div class="client-card" onclick="App.showClientPanel(event, \'' + x.id + '\', \'' + Utils.escapeHtml(x.name).replace(/'/g, "\\'") + '\')">' +
                        '<span><strong>' + Utils.escapeHtml(x.name) + '</strong> — ' + Utils.formatDate(x.date) + ' (' + x.age + ' ' + Utils.getAgeWord(x.age) + ')</span>' +
                        (x.phone ? '<span>📱 ' + Utils.escapeHtml(x.phone) + '</span>' : '') +
                        '<span style="font-size:12px;color:var(--accent);">' + st + '</span>' +
                        '</div>';
                }).join('');
            }

            function renderStats() {
                const s = Services.getStats();
                getEl('statTotal').textContent = s.total;
                getEl('statCompleted').textContent = s.completed;
                getEl('statPercent').textContent = s.percent + '%';
                getEl('progressFill').style.width = s.percent + '%';
                if (s.folderStats && s.folderStats.length) {
                    getEl('statsDetails').innerHTML = '<strong>По папкам:</strong><br>' +
                        s.folderStats.map(fs => fs.icon + ' ' + Utils.escapeHtml(fs.name) + ': ' + fs.completed + '/' + fs.total).join('<br>');
                } else {
                    getEl('statsDetails').innerHTML = '<p style="color:var(--text-secondary);text-align:center;">Нет папок для статистики</p>';
                }
            }

            function renderAll(calendarState = null) {
                renderCustomQuotes();
                renderWeekOverview();
                renderFolderList();
                renderTasks();
                renderNotes();
                renderAI();
                renderClients();
                if (calendarState) renderCalendar(calendarState.year, calendarState.month, calendarState.selectedDate);
                if (getEl('section-stats').classList.contains('active')) renderStats();
            }

            return {
                showToast, updateQuote, renderCustomQuotes, renderFolderList, renderTasks,
                renderNotes, renderCalendar, renderCalendarTasks, renderAI, renderClients,
                renderStats, renderAll, renderWeekOverview
            };
        })();

        // ========================================
        // ДЕЙСТВИЯ (ACTIONS)
        // ========================================
        const Actions = {
            openFolder(fid) {
                State.setCurrentFolderId(fid);
                State.setCurrentTaskFilter(FILTERS.ACTIVE);
                getEl('searchContainer').style.display = 'none';
                State.save();
                UI.renderAll();
            },
            toggleTask(tid) {
                const found = Utils.findTaskById(tid);
                if (!found) return;
                found.task.completed = !found.task.completed;
                Services.processRepeats();
                State.save();
                UI.renderAll();
                UI.showToast(found.task.completed ? 'Выполнена' : 'Восстановлена');

                if (found.task.completed) {
                    try { confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } }); } catch (e) {}
                    const allDone = found.folder.tasks.length > 0 && found.folder.tasks.every(t => t.completed);
                    if (allDone) {
                        setTimeout(() => {
                            try { confetti({ particleCount: 200, spread: 120, origin: { y: 0.5 } }); } catch (e) {}
                            try { confetti({ particleCount: 200, spread: 120, origin: { y: 0.5, x: 0.2 } }); } catch (e) {}
                            try { confetti({ particleCount: 200, spread: 120, origin: { y: 0.5, x: 0.8 } }); } catch (e) {}
                            UI.showToast('Все задачи выполнены!');
                        }, 300);
                    }
                }
            },
            addTask() {
                const cid = State.getCurrentFolderId();
                if (Utils.isSmartFolder(cid)) { UI.showToast('Нельзя создавать задачи в этой папке'); return; }

                const ti = getEl('taskInput'), td = getEl('taskDate'), tt = getEl('taskTime'),
                    tr = getEl('taskRepeat'), trd = getEl('taskRepeatDays');
                if (!ti || !td || !tt || !tr) return;

                const text = ti.value.trim();
                if (!text) { UI.showToast('Введите текст'); return; }

                const f = State.findFolderById(cid);
                if (!f) return;

                const repeat = tr.value;
                const repeatDays = repeat === 'custom' ? parseInt(trd.value) || 1 : 0;

                f.tasks.push({
                    id: Utils.generateId(), text, date: td.value, time: tt.value || undefined,
                    completed: false, subtasks: [], repeat: repeat || undefined,
                    repeatDays: repeatDays || undefined, priority: 0,
                    keepSubtasksDone: false
                });

                ti.value = ''; tr.value = ''; trd.style.display = 'none';
                State.setCurrentTaskFilter(FILTERS.ACTIVE);
                State.save();
                UI.renderAll();
                UI.showToast('Задача добавлена!');
            },
            addTaskPopup() {
                const cid = State.getCurrentFolderId();
                if (Utils.isSmartFolder(cid)) { UI.showToast('❌ Нельзя создавать задачи в этой папке'); return; }
                
                const overlay = getEl('actionOverlay');
                const panel = getEl('actionPanel');
                const title = getEl('actionPanelTitle');
                const buttons = getEl('actionPanelButtons');
                
                title.textContent = 'Новая задача';

            exportData() {
                try {
                    const json = JSON.stringify({
                        folders: State.getFolders(), notes: State.getNotes(),
                        clients: State.getClients(), customQuotes: State.getCustomQuotes()
                    });
                    const blob = new Blob([json], { type: 'application/json' });
                    const fileName = 'my_plans_backup_' + new Date().toISOString().slice(0, 10) + '.json';
                    const file = new File([blob], fileName, { type: 'application/json' });

                    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({ files: [file], title: 'Мои планы' })
                            .then(() => UI.showToast('Отправлено'))
                            .catch(() => {
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url; a.download = fileName;
                                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                                URL.revokeObjectURL(url);
                                UI.showToast('Экспортировано');
                            });
                    } else {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url; a.download = fileName;
                        document.body.appendChild(a); a.click(); document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        UI.showToast('Экспортировано');
                    }
                } catch (e) { UI.showToast('❌ Ошибка'); }
            },
            importData() {
                const inp = document.createElement('input');
                inp.type = 'file'; inp.accept = '.json,.txt,application/json'; inp.style.display = 'none';
                document.body.appendChild(inp);
                inp.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (!file) { document.body.removeChild(inp); return; }
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        try {
                            const imp = JSON.parse(ev.target.result);
                            if (!imp || typeof imp !== 'object' || !Array.isArray(imp.folders)) throw new Error('Формат');
                            const backup = JSON.stringify({
                                folders: State.getFolders(), notes: State.getNotes(),
                                clients: State.getClients(), customQuotes: State.getCustomQuotes()
                            });
                            try {
                                localStorage.setItem(STORAGE_KEY, JSON.stringify(imp));
                                State.load(); Services.processRepeats();
                                UI.renderAll(); UI.showToast('Импортировано');
                            } catch (inner) {
                                localStorage.setItem(STORAGE_KEY, backup);
                                State.load(); throw inner;
                            }
                        } catch (err) { UI.showToast('❌ Ошибка: ' + err.message); }
                        document.body.removeChild(inp);
                    };
                    reader.onerror = () => { UI.showToast('❌ Не удалось прочитать'); document.body.removeChild(inp); };
                    reader.readAsText(file);
                });
                inp.click();
            },

                if (!('Notification' in window)) { UI.showToast('❌ Не поддерживаются'); return; }
                if (Notification.permission === 'granted') { Actions.checkAndNotify(); }

                    Notification.requestPermission().then(p => {
                        if (p === 'granted') Actions.checkAndNotify();
                        else UI.showToast('❌ Разрешите в настройках');
                    });
                }
            },

                const tasks = Services.getTasksForNotification();
                if (!tasks.length) { UI.showToast('Нет задач в ближайший час'); return; }
                tasks.forEach(t => {
                    const min = Math.ceil((new Date(t.date + 'T' + t.time) - new Date()) / 60000);
                    new Notification('Напоминание', { body: '«' + t.text + '» через ' + min + ' мин.', tag: t.id });
                });
                UI.showToast('Найдено: ' + tasks.length + ' задач');

            handleDragStart: function(e) {
                e.target.classList.add('dragging');
                e.dataTransfer.setData('text/plain', JSON.stringify({
                    taskId: e.target.dataset.taskId,
                    fromFolderId: e.target.dataset.folderId
                }));
                e.dataTransfer.effectAllowed = 'move';
            },
            handleDragEnd: function(e) {
                e.target.classList.remove('dragging');
                document.querySelectorAll('.folder-card').forEach(c => c.classList.remove('drag-over'));
            },
            handleDragOver: function(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                e.currentTarget.classList.add('drag-over');
            },
            handleDragLeave: function(e) { e.currentTarget.classList.remove('drag-over'); },
            handleDrop: function(e, toFid) {
                e.preventDefault();
                e.currentTarget.classList.remove('drag-over');
                try {
                    const d = JSON.parse(e.dataTransfer.getData('text/plain'));
                    const { taskId, fromFolderId } = d;
                    if (fromFolderId === toFid || Utils.isSmartFolder(toFid)) return;
        
                    const ff = State.findFolderById(fromFolderId);
                    const tf = State.findFolderById(toFid);
                    if (!ff || !tf) return;
        
                    const idx = ff.tasks.findIndex(t => t && t.id === taskId);
                    if (idx === -1) return;
        
                    const task = ff.tasks.splice(idx, 1)[0];
                    tf.tasks.push(task);
                    State.save();
                    UI.renderAll();
                    UI.showToast('Перемещена');
                } catch (err) { UI.showToast('❌ Ошибка'); }
            },
            openDateView: function(ds) { Actions.openDateView(ds); },
            goToFolder: function(folderName) {
                const allFolders = State.getFolders();
                
                function findInFolder(folder) {
                    if (folder.name === folderName) return folder;
                    if (Array.isArray(folder.subfolders)) {
                        for (const sub of folder.subfolders) {
                            const found = findInFolder(sub);
                            if (found) return found;
                        }
                    }
                    return null;
                }
                
                for (let i = 0; i < allFolders.length; i++) {
                    const found = findInFolder(allFolders[i]);
                    if (found) {
                        State.setCurrentFolderId(found.id);
                        State.setCurrentTaskFilter('active');
                        const sc = getEl('searchContainer');
                        if (sc) sc.style.display = 'none';
                        State.save();
                        document.querySelectorAll('#mainTabs .tab').forEach(t => t.classList.remove('active'));
                        document.querySelector('#mainTabs .tab[data-tab="tasks"]').classList.add('active');
                        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                        getEl('section-tasks').classList.add('active');
                        UI.renderAll();
                        return;
                    }
                }
                UI.showToast('Папка не найдена: ' + folderName);
            },
